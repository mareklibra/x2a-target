---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Deploy nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Deploy nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    owner: www-data
    group: www-data
    mode: "0755"
    state: directory
    recurse: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Deploy site index files
  ansible.builtin.copy:
    content: "{{ item_nginx_site_file['value']['index_content'] }}"
    dest: "{{ item_nginx_site_file['value']['document_root'] }}/index.html" # noqa: R114 - path from role-defined sites dictionary
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop:
    - name: test.cluster.local
      document_root: /opt/server/test
      index_content: test.cluster.local
    - name: ci.cluster.local
      document_root: /opt/server/ci
      index_content: ci.cluster.local
    - name: status.cluster.local
      document_root: /opt/server/status
      index_content: status.cluster.local
  loop_control:
    loop_var: item_nginx_site_file
