---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI tutorial system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create FastAPI tutorial application directory
  ansible.builtin.file:
    path: /opt/fastapi-tutorial
    owner: root
    group: root
    mode: "0755"
    state: directory
    recurse: true

- name: Synchronize FastAPI tutorial repository  # noqa: R104,R106 - repository URL comes from trusted role defaults and uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: /opt/fastapi-tutorial
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - /opt/fastapi-tutorial/venv
    creates: /opt/fastapi-tutorial/venv

- name: Install FastAPI tutorial Python dependencies
  ansible.builtin.pip:
    requirements: /opt/fastapi-tutorial/requirements.txt
    virtualenv: /opt/fastapi-tutorial/venv
    virtualenv_command: python3 -m venv
    virtualenv_python: python3

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create FastAPI PostgreSQL role and database  # noqa: L039,R101 - credentials are validated by the prior task and the command intentionally uses trusted role parameters
  ansible.builtin.shell:
    cmd: |
      psql -c "DO \$\$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ database_username }}') THEN
        CREATE ROLE {{ database_username }} LOGIN PASSWORD '{{ database_password }}';
      ELSE
        ALTER ROLE {{ database_username }} WITH PASSWORD '{{ database_password }}';
      END IF;
      END \$\$;"
      psql -tc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1 || \
        createdb -O '{{ database_username }}' '{{ database_name }}'
      psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};"
  become: true  # noqa: R108 - PostgreSQL role/database administration requires the postgres account
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI tutorial environment file  # noqa: L039 - credential variables are validated by the prior task
  ansible.builtin.copy:
    dest: /opt/fastapi-tutorial/.env
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@{{ database_host }}/{{ database_name }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI tutorial systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/fastapi-tutorial
      Environment="PATH=/opt/fastapi-tutorial/venv/bin"
      ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting FastAPI tutorial
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
